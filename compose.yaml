services:
  crypto-api:
    build: ./crypto-api
    environment:
      DATABASE_URL: sqlite:////data/cryptoinsight.db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      DEFAULT_COINS: ${DEFAULT_COINS:-bitcoin,ethereum,solana}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-usd}
    volumes:
      - crypto_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  crypto-dashboard:
    build: ./crypto-dashboard
    environment:
      CRYPTO_API_URL: http://crypto-api:8000
      DEFAULT_COINS: ${DEFAULT_COINS:-bitcoin,ethereum,solana}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-usd}
    ports:
      - "8501:8501"
    depends_on:
      crypto-api:
        condition: service_healthy

volumes:
  crypto_data:
